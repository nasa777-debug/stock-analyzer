{% extends 'base.html' %}

{% block title %}Login | Stock Analyzer{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fa-solid fa-chart-line"></i>
                <span>Stock Analyzer</span>
            </div>
            <p class="login-subtitle">Simulate investments and build market insights</p>
        </div>

        <!-- Auth Switch Tabs -->
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
            <button type="button" class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Create Account</button>
        </div>

        <form method="POST" action="{{ url_for('login_page') }}" id="auth-form">
            <!-- Action Selector: login or register -->
            <input type="hidden" name="action" id="auth-action" value="login">

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" name="username" id="username" class="input-control" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="input-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function switchAuthTab(type) {
        const actionInput = document.getElementById('auth-action');
        const loginTab = document.getElementById('tab-login');
        const registerTab = document.getElementById('tab-register');
        const submitBtn = document.getElementById('submit-btn');
        
        actionInput.value = type;
        
        if (type === 'login') {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
        } else {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
        }
    }
</script>
{% endblock %}
